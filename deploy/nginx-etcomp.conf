# /etc/nginx/sites-available/ETcomp
# Next.js (ETcomp) uchun Nginx reverse-proxy konfiguratsiyasi.
# Serverga qo'llashdan oldin joriy faylni backup qiling:
#   sudo cp /etc/nginx/sites-available/ETcomp /etc/nginx/sites-available/ETcomp.bak

server {
    listen 80;
    listen [::]:80;
    server_name etcom.app.re.kr;

    # Let's Encrypt HTTP-01 challenge uchun (certbot avtomatik yangilashda ishlatadi)
    location /.well-known/acme-challenge/ {
        root /var/www/ETcomp;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etcom.app.re.kr;

    ssl_certificate     /etc/letsencrypt/live/etcom.app.re.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etcom.app.re.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js statik build fayllari (immutable, uzoq muddat cache qilinadi)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
